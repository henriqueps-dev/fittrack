spring:
  application:
    name: fittrack-backend
  datasource:
    # DB_URL completo, ou as partes separadas (formato usado por provedores como o Render)
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fittrack}}
    username: ${DB_USERNAME:fittrack}
    password: ${DB_PASSWORD:fittrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    # Quando true, a API devolve o token de recuperacao na resposta (apenas para desenvolvimento,
    # ja que o projeto nao possui servidor SMTP configurado). Em producao, use false.
    expose-reset-token: ${EXPOSE_RESET_TOKEN:true}
    frontend-url: ${FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:4200}}
