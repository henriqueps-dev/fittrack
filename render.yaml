# Blueprint do Render: New -> Blueprint -> selecione este repositorio.
services:
  - type: web
    name: fittrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: fittrack-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: fittrack-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: fittrack-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: fittrack-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: fittrack-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: EXPOSE_RESET_TOKEN
        value: "false"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"

databases:
  - name: fittrack-db
    plan: free
    databaseName: fittrack
    user: fittrack
